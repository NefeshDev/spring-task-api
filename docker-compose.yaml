version: '3.8'

services:
  postgres:
    image: postgres:16.3
    container_name: meu_postgres
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: ${TESTE_DATABASE_PASSWORD}
      POSTGRES_DB: db_tasks
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
